[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nmrpeaksim"
version = "0.1.0"
description = "Interactive simulator for first-order NMR multiplets and coupling trees"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Peter Cruz Parrilla", email = "peter.cruzparrilla@gmail.com"}]
dependencies = [
    "numpy>=2.0",
    "dearpygui>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
nmrpeaksim = "nmrpeaksim.gui.main:main"

[tool.setuptools]
packages = ["nmrpeaksim", "nmrpeaksim.core", "nmrpeaksim.gui"]
