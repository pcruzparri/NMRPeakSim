name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # dearpygui's compiled extension lists libX11.so.6 as a hard DT_NEEDED
      # entry, so importing it fails on a bare Linux runner. GL is loaded lazily
      # at context creation, which the tests never reach, so this is enough.
      - name: Install X11 runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check dearpygui imports
        run: python -c "import dearpygui.dearpygui"

      - name: Run tests
        run: pytest tests/ -v
